name: Python package

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Check style
        run: uv run --locked flake8 . --count --statistics
      - name: Type-check companion policy
        run: uv run --locked mypy --strict --follow-imports=skip pycozmo/companion.py
      - name: Run tests
        run: uv run --locked pytest

  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.12 --extra vision
      - run: uv run --locked --extra vision pytest pycozmo/tests/test_vision.py pycozmo/tests/test_face_registry.py

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.12 --group docs
      - run: uv run --locked --group docs sphinx-build -b html -W --keep-going docs/source /tmp/pycozmo-docs

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv venv --python 3.12 /tmp/pycozmo-wheel-test
      - run: uv pip install --python /tmp/pycozmo-wheel-test/bin/python dist/*.whl
      - name: Import the installed package outside the checkout
        working-directory: /tmp
        run: /tmp/pycozmo-wheel-test/bin/python -c "import pycozmo; import pycozmo.vision; import pycozmo.companion"
