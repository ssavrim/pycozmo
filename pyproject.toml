[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "pycozmo"
version = "0.9.0"
description = "PyCozmo with its protocol, frame layer and offline algorithms implemented in Rust (study branch)."
readme = "RUST-REWRITE.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "dpkt",
    "numpy",
    "Pillow>=9.1",
    "flatbuffers>=2.0",
    "opencv-contrib-python-headless>=4.12,<6",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[dependency-groups]
test = ["pytest"]

[tool.maturin]
manifest-path = "crates/cozmo-py/Cargo.toml"
module-name = "pycozmo._cozmo"
python-source = "."
python-packages = ["pycozmo"]
features = []

[tool.pytest.ini_options]
testpaths = ["pycozmo"]
